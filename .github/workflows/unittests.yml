name: Python wrapper tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.14"]
        include:
          # Python 3.9 has no setup-python build for Ubuntu 26.04.
          - os: ubuntu-24.04
            python-version: "3.9"
            publish_coverage: false
          - os: ubuntu-latest
            python-version: 3.11
            publish_coverage: true
          - os: macos-latest
            python-version: "3.14"
            publish_coverage: false
          # - os: windows-latest
          #   python-version: "3.14"
          #   publish_coverage: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Run Tests (disclosure)
        run: |
          cd disclosure
          uv run --dev --python ${{ matrix.python-version }} pytest \
            --color=yes \
            --cov \
            --cov-report=term \
            --cov-report=xml \
            --cov-report=html


      - name: Upload coverage report to GitHub
        if: ${{ (success() || failure()) && matrix.publish_coverage }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            disclosure/coverage.xml
            disclosure/htmlcov/
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        if: ${{ (success() || failure()) && matrix.publish_coverage && hashFiles('disclosure/coverage.xml') != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: chaoss/collectoss-wrappers
          files: disclosure/coverage.xml
          flags: unit-disclosure
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false
